version: 2
updates:
  - package-ecosystem: npm
    directory: /labs/reverse-proxy/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        dependency-type: development
  - package-ecosystem: docker
    directory: /labs/reverse-proxy/api
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
