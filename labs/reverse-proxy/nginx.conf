worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
  server_tokens off;
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;

  map $http_x_request_id $request_id_safe {
    default $request_id;
    ~^[A-Za-z0-9._-]{1,64}$ $http_x_request_id;
  }

  limit_req_zone $binary_remote_addr zone=per_ip:1m rate=10r/s;

  server {
    listen 8080;
    client_max_body_size 16k;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Request-ID $request_id_safe always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /health {
      proxy_pass http://api:3000/health;
      proxy_set_header X-Request-ID $request_id_safe;
    }

    location /api/ {
      limit_req zone=per_ip burst=20 nodelay;
      proxy_pass http://api:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id_safe;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }

    location / { return 404; }
  }
}
